.box{background:var(--panel);border:4px solid var(--edge);box-shadow:inset -4px -4px 0 var(--bevel),6px 6px 0 var(--sh)}
.topline{background:var(--bar);color:#f4f4f4;border-bottom:4px solid var(--gold);font:9px var(--px)}
.topline .wrap{min-height:38px;display:flex;align-items:center;justify-content:center;gap:16px}
.hp{display:flex;align-items:center;gap:8px}.hp i{display:block;width:110px;height:12px;border:2px solid #f4f4f4;background:#333c57}.hp b{display:block;height:100%}
.hp.rad b{background:#38b764}.hp.dire b{background:#e0505f}
header{position:sticky;top:0;z-index:40;background:var(--panel2);border-bottom:4px solid var(--edge);box-shadow:0 4px 0 var(--sh)}
.nav{min-height:70px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font:14px var(--px);white-space:nowrap}
.logo-mark{width:42px;height:42px;border:4px solid var(--edge);background:#fff;overflow:hidden;display:grid;place-items:center}
.logo-mark img{width:100%;height:100%;object-fit:cover}.logo-red{color:var(--hot)}
.navlinks{display:flex;gap:6px;flex:1}
.navlinks button{border:0;background:transparent;font:10px var(--px);padding:12px 10px}
.navlinks button:hover{background:var(--edge);color:var(--panel)}
.navlinks button:hover:before{content:"▶ "}
.nav-actions{display:flex;gap:8px;align-items:center}
.search{display:flex;align-items:center;gap:8px;border:4px solid var(--edge);background:#fff;color:#1a1c2c;padding:6px 8px;min-width:200px}
.search input{border:0;outline:0;background:transparent;width:100%;color:#1a1c2c;font-size:20px}
.btn,.icon-btn,.cart{font:10px var(--px);background:var(--panel);color:var(--text);border:4px solid var(--edge);padding:10px 12px;box-shadow:inset -4px -4px 0 var(--bevel),4px 4px 0 var(--sh)}
.btn:hover,.icon-btn:hover,.cart:hover{background:var(--gold);color:#1a1c2c}
.btn:active,.icon-btn:active,.cart:active{transform:translate(4px,4px);box-shadow:none}
.btn.red{background:var(--hot);color:#fff}.btn.red:hover{background:var(--gold);color:#1a1c2c}
.dot{display:inline-block;width:10px;height:10px;background:var(--acc);margin-right:6px}
.cart{display:flex;align-items:center;gap:8px}
.hero{padding:30px 0 12px}.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}
.title{padding:34px;display:flex;flex-direction:column;justify-content:center;background:var(--panel)}
.kicker{font:9px var(--px);color:var(--hot);line-height:1.6}
.title h1{font:clamp(16px,2.1vw,26px)/1.9 var(--px);letter-spacing:.02em;margin:20px 0 22px;text-shadow:2px 2px 0 var(--gold)}
html.dark .title h1{text-shadow:3px 3px 0 #1a1c2c}
.title h1:after{content:"";display:block;width:24px;height:8px;margin-top:18px;background:var(--hot);box-shadow:32px 0 0 var(--gold),64px 0 0 var(--acc)}
.title p{font-size:24px;color:var(--muted);max-width:560px;margin:0}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.trust{margin-top:22px;font-size:20px;color:var(--muted)}
.scene{display:flex;flex-direction:column;min-height:440px;overflow:hidden;padding:0;background:var(--sky)}
.stage{flex:1;position:relative;min-height:220px}.stage>*{position:absolute}
.sun{top:22px;right:26px;width:40px;height:40px;background:var(--sun);box-shadow:0 0 0 8px rgba(255,255,255,.25)}
.s-tower{left:9%;bottom:0}.s-sword{right:10%;bottom:0}
.s-aegis{left:50%;top:34px;margin-left:-44px;animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.ground{background:var(--g1);border-top:8px solid var(--g3);padding:14px}
.dialog{position:relative;background:#1a1c2c;color:#f4f4f4;border:4px solid #f4f4f4;padding:14px 18px;box-shadow:0 0 0 4px #1a1c2c}
.dialog .kicker{color:var(--gold)}.dialog h2{font:12px/1.6 var(--px);margin:8px 0}.dialog p{margin:0;font-size:19px;color:#94b0c2}
.arrow{position:absolute;right:12px;bottom:8px;color:var(--gold);font:10px var(--px);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.section{padding:28px 0}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px;padding-bottom:10px;border-bottom:4px dashed var(--edge)}
.section-head h2{margin:0;font:17px var(--px)}.section-head p{margin:8px 0 0;color:var(--muted);font-size:22px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:var(--panel);border:4px solid var(--edge);box-shadow:inset -4px -4px 0 var(--bevel),6px 6px 0 var(--sh);display:flex;flex-direction:column}
.card:hover{transform:translate(-2px,-2px);border-color:var(--gold)}
.visual{height:118px;display:grid;place-items:center;border-bottom:4px solid var(--edge);background:linear-gradient(#b13e53 0 50%,#8c2f46 50%)}
.esport .visual{background:linear-gradient(#3b5dc9 0 50%,#2f4aa8 50%)}
.product .visual{background:linear-gradient(#566c86 0 50%,#475a73 50%);border-bottom-color:var(--rc,var(--edge))}
.body{padding:14px;display:flex;flex-direction:column;flex:1}
.tag{font:8px var(--px);color:var(--rc,var(--hot));line-height:1.6}
.title-c{font:11px/1.6 var(--px);margin:8px 0}
.meta{color:var(--muted);font-size:19px}
.read{margin-top:auto;padding-top:10px;font:9px var(--px);color:var(--hot);cursor:pointer}.read:hover{color:var(--text)}
.xp{display:inline-block;background:var(--bar);color:var(--gold);font:8px var(--px);padding:3px 5px;margin-right:6px}
.product{border-color:var(--rc,var(--edge))}.product .tag{color:var(--rc)}
.r-common{--rc:var(--r-common)}.r-rare{--rc:var(--r-rare)}.r-myth{--rc:var(--r-myth)}.r-imm{--rc:var(--r-imm)}.r-arcana{--rc:var(--r-arcana)}
.price{display:flex;align-items:center;gap:8px;font:12px var(--px);margin-top:10px}
.stock{color:var(--acc);font-size:20px;margin-top:6px}
.buy{width:100%;margin-top:12px;font:9px var(--px);padding:12px 8px;background:var(--acc);color:#1a1c2c;border:4px solid var(--edge);box-shadow:inset -4px -4px 0 rgba(0,0,0,.2)}
.buy:hover{background:var(--gold)}.buy:active{transform:translateY(4px)}
.visual{overflow:hidden}.pimg{width:100%;height:100%;object-fit:cover;display:block}
.buy-row{display:flex;gap:8px;margin-top:12px}.buy-row .buy{margin-top:0;width:auto}.buy.wa{flex:1;background:#25d366}.buy.wa:hover{background:var(--gold)}.buy.tg{flex:1;background:#2aabee}.buy.tg:hover{background:var(--gold)}.buy.alt{background:var(--panel);color:var(--text)}.buy.alt:hover{background:var(--gold);color:#1a1c2c}
.category-row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.cat{padding:16px;cursor:pointer}
.slot{width:60px;height:60px;display:grid;place-items:center;background:var(--bar);border:4px solid var(--edge);margin-bottom:12px;box-shadow:inset 3px 3px 0 rgba(255,255,255,.15)}
.cat b{display:block;font:11px var(--px)}.cat small{display:block;margin-top:8px;color:var(--muted);font-size:20px}
.guide{padding:0;min-height:150px}.gbody{padding:16px;display:flex;flex-direction:column;flex:1}.guide .mini{font:9px var(--px);color:var(--hot)}.guide h3{font:11px/1.6 var(--px);margin:10px 0 8px}.guide p{margin:0;color:var(--muted);font-size:20px}
.lv{margin-top:12px;font:8px var(--px);display:flex;align-items:center;gap:8px}.lv i{display:inline-block;width:14px;height:14px;border:2px solid var(--edge);background:var(--acc)}.lv i.off{background:transparent}
.tabs{display:flex;gap:8px;overflow:auto;padding:0 6px 10px 0;margin-bottom:12px}
.tab{white-space:nowrap;font:9px var(--px);background:var(--panel);border:4px solid var(--edge);padding:10px 12px}.tab.active,.tab:hover{background:var(--gold);color:#1a1c2c}
.socials{display:flex;gap:10px;flex-wrap:wrap}.social{display:inline-flex;align-items:center;gap:8px;border:4px solid var(--edge);background:var(--panel);padding:6px 10px;font-size:20px}
.social i{background:var(--hot);color:#fff;font:8px var(--px);font-style:normal;padding:5px}
.social:hover{background:var(--gold);color:#1a1c2c}
footer{border-top:4px solid var(--edge);margin-top:32px;padding:28px 0;background:var(--panel2);font-size:21px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:rgba(13,14,23,.8);z-index:100;overflow:auto}.modal.show{display:block}
.modalbox{width:min(780px,calc(100% - 28px));margin:5vh auto;padding:24px;background:#1a1c2c;color:#f4f4f4;border:4px solid #f4f4f4;box-shadow:0 0 0 4px #1a1c2c,8px 8px 0 4px rgba(0,0,0,.6)}
.modalbox h2{font:16px/1.6 var(--px)}.modalbox .tag{color:var(--gold)}.modalbox .meta,.modalbox p{color:#94b0c2}
.close{float:right;font:12px var(--px);background:var(--hot);color:#fff;border:4px solid #f4f4f4;padding:8px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a1c2c;color:var(--gold);border:4px solid #f4f4f4;padding:12px 16px;font:10px var(--px);z-index:200;display:none}.toast.show{display:block}
@media(max-width:1000px){.hero-grid{grid-template-columns:1fr}.grid-4{grid-template-columns:repeat(2,1fr)}.category-row{grid-template-columns:repeat(3,1fr)}.nav{flex-wrap:wrap;padding:8px 0}.navlinks{order:3;width:100%;overflow:auto}.search{min-width:140px}.hp i{width:60px}}
@media(max-width:620px){.wrap{padding:0 14px}.grid-4,.grid-3,.category-row{grid-template-columns:1fr}.search,.hp{display:none}.title{padding:24px}.logo{font-size:12px}}
@media(prefers-reduced-motion:reduce){.s-aegis,.arrow{animation:none}.card{transition:none}}

/* TEMA: Radiant = hutan segar, Dire = hutan kering + lava */
:root{--dbg:#3b2412;--dedge:#f3e3b8;--dtxt:#fff6dc;--dmut:#e8d2a0}
html.dark{--dbg:#0d0505;--dedge:#ff7a1a;--dtxt:#f6e2d6;--dmut:#c09a8c}
.kicker,.tag,.read,.guide .mini,.logo-red{color:var(--hot-t)}
.product .tag{color:var(--rc)}.dialog .kicker{color:var(--gold)}.modalbox .tag{color:var(--gold)}
.dialog{background:var(--dbg);color:var(--dtxt);border-color:var(--dedge);box-shadow:0 0 0 4px var(--dbg)}
.dialog p,.modalbox .meta,.modalbox p{color:var(--dmut)}
.modalbox{background:var(--dbg);color:var(--dtxt);border-color:var(--dedge);box-shadow:0 0 0 4px var(--dbg),8px 8px 0 4px rgba(0,0,0,.6)}
.close{border-color:var(--dedge)}.toast{background:var(--dbg);border-color:var(--dedge)}
.topline{border-bottom-color:var(--gold)}
html.dark .title h1{text-shadow:3px 3px 0 #7a1c14}
.visual{background:linear-gradient(#3f9b3a 0 50%,#348532 50%)}
.esport .visual{background:linear-gradient(#41a6f6 0 50%,#3490d6 50%)}
.product .visual{background:linear-gradient(#a8743a 0 50%,#8f6230 50%)}
html.dark .visual{background:linear-gradient(#7a1c14 0 50%,#5a130d 50%)}
html.dark .esport .visual{background:linear-gradient(#4a1a05 0 50%,#3a1204 50%)}
html.dark .product .visual{background:linear-gradient(#2b1a1a 0 50%,#201212 50%)}
html.dark .rad-only{display:none}html:not(.dark) .dire-only{display:none}
.s-tree1{left:28%;bottom:0}.s-tree2{right:30%;bottom:0}
.cloud{top:50px;left:14%;width:16px;height:16px;background:#fff;box-shadow:16px 0 #fff,32px 0 #fff,48px 0 #fff,16px -16px #fff,32px -16px #fff,180px 50px #fff,196px 50px #fff,212px 50px #fff,196px 34px #fff}
.ember{top:70px;left:30%;width:8px;height:8px;background:#ffb347;box-shadow:60px 40px #ff7a1a,120px -20px #ffb347,180px 50px #ff5a1a,-20px 90px #ff7a1a,240px 10px #ffb347}
html.dark .sun{box-shadow:0 0 0 8px rgba(255,90,40,.28),0 0 0 16px rgba(255,90,40,.12)}
</style>

aegis:[".kkkkkkkk.","kggggggggk","kgwggggggk","kggrrrrggk","kggrrrrggk","kggrrrrggk",".kggrrggk.","..kggggk..","...kggk...","....kk...."],

function spr(n,px){const m=SP[n];let r="";m.forEach((row,y)=>[...row].forEach((c,x)=>{if(PAL[c])r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[c]}"/>`}));return `<svg class="spr" viewBox="0 0 10 ${m.length}" width="${px}" height="${px*m.length/10}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`}

let realNews=false,realGuides=false;
let articles=[
{cat:"Dota 2",title:"Patch terbaru mengubah meta: hero mana yang naik daun?",date:"5 Okt 2026"},
{cat:"Esports",title:"Perjalanan turnamen minggu ini: hasil dan sorotan utama",date:"4 Okt 2026"},
{cat:"Update",title:"Event baru hadir dengan reward eksklusif",date:"3 Okt 2026"},
{cat:"Gaming",title:"5 hal yang membuat pertandingan ranked lebih seru",date:"2 Okt 2026"},
{cat:"Dota 2",title:"Panduan memilih Arcana untuk koleksi pertama",date:"1 Okt 2026"},
{cat:"Komunitas",title:"Cerita pemain: dari pub match sampai turnamen lokal",date:"30 Sep 2026"}
];
let guidesData=[
{role:"Carry",title:"Hero Carry untuk pemain yang suka late game",desc:"Pilihan hero, item inti, dan kebiasaan farming."},
{role:"Mid",title:"Cara menjaga tempo lane dan rotasi lebih rapi",desc:"Dasar map awareness untuk pemain mid."},
{role:"Support",title:"Ward, vision, dan kebiasaan kecil yang berdampak besar",desc:"Panduan praktis untuk support baru."},
{role:"Item",title:"Mengenal rare, immortal, arcana, dan bundle",desc:"Panduan santai untuk kolektor item Dota 2."},
{role:"New Player",title:"Panduan awal Dota 2 untuk pemain baru",desc:"Mulai dari setting, role, sampai pilihan hero."},
{role:"Tips",title:"5 kebiasaan sederhana untuk naik rank",desc:"Fokus pada hal yang bisa kamu kontrol."}
];
let esportsData=[{title:"Recap turnamen akhir pekan",cat:"Turnamen"},{title:"Tim dan roster yang sedang ramai",cat:"Tim dan Roster"},{title:"Jadwal pertandingan pilihan minggu ini",cat:"Jadwal"},{title:"Perjalanan menuju grand final",cat:"Turnamen"},{title:"Pemain breakout yang patut dilihat",cat:"Pemain"},{title:"Cerita komunitas Dota 2 Indonesia",cat:"Komunitas"}];
let products=[
{name:"Collector's Cache — Set A",cat:"dota",sub:"cache",price:85000,stock:12},
{name:"Hero Bundle — Warrior",cat:"dota",sub:"bundle",price:120000,stock:5},
{name:"Arcana — Phantom Style",cat:"dota",sub:"arcana",price:425000,stock:3},
{name:"Immortal Treasure",cat:"dota",sub:"immortal",price:65000,stock:20},
{name:"Steam Wallet Rp 45.000",cat:"wallet",sub:"wallet",price:49000,stock:25},
{name:"Steam Wallet Rp 90.000",cat:"wallet",sub:"wallet",price:95000,stock:20},
{name:"Mobile Legends — Diamonds",cat:"topup",sub:"ml",price:10000,stock:50},
{name:"Roblox — Robux",cat:"topup",sub:"roblox",price:25000,stock:50}
];
const RAR={cache:["r-rare","Collector's Cache","chest"],bundle:["r-myth","Bundle Set","book"],arcana:["r-arcana","Arcana","gem"],immortal:["r-imm","Immortal","rapier"],wallet:["r-common","Steam Wallet","coin"],ml:["r-common","Top Up Game","heart"],roblox:["r-common","Top Up Game","heart"]};
let cart=JSON.parse(localStorage.getItem("pjd_cart")||"[]");
const A=document.getElementById("app");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const rp=n=>"Rp "+new Intl.NumberFormat("id-ID").format(n);
const q=s=>s.replace(/'/g,"\\'");

function updateCart(){document.getElementById("cartCount").textContent=cart.reduce((a,x)=>a+x.qty,0);localStorage.setItem("pjd_cart",JSON.stringify(cart))}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1800)}
function productCard(p){const r=RAR[p.sub];return `<article class="card product ${r[0]}"><div class="visual">${p.img?`<img class="pimg" src="${p.img}" alt="${String(p.name).replace(/"/g,"&quot;")}">`:spr(r[2],64)}</div><div class="body"><div class="tag">${r[1]}</div><div class="title-c">${p.name}</div><div class="price">${spr("coin",18)}${rp(p.price)}</div><div class="stock">Stok x${p.stock}</div><div class="meta" style="margin-top:12px">Beli via:</div><div class="buy-row" style="margin-top:4px"><button class="buy wa" onclick="buyNow('${q(p.name)}')">WhatsApp</button><button class="buy tg" onclick="buyNow('${q(p.name)}','tg')">Telegram</button></div><button class="buy alt" style="margin-top:8px" onclick="addCart('${q(p.name)}')">+ Masuk tas</button></div></article>`}
function articleCard(a){return `<article class="card article"><div class="visual">${a.img?`<img class="pimg" src="${a.img}" alt="">`:spr("scroll",64)}</div><div class="body"><div class="tag">Quest · ${a.cat}</div><div class="title-c">${a.title}</div><div class="meta"><span class="xp">+50 XP</span>${a.date} · 5 menit</div><div class="read" onclick="article('${q(a.title)}')">Baca selengkapnya ▶</div></div></article>`}
function guideCard(g,i){const l=+g.level||3+(i%2);return `<article class="card guide">${g.img?`<div class="visual"><img class="pimg" src="${g.img}" alt=""></div>`:""}<div class="gbody"><div class="mini">Role: ${g.role}</div><h3>${g.title}</h3><p>${g.desc||""}</p><div class="lv">GUIDE LV ${[1,2,3,4].map(n=>`<i class="${n<=l?"":"off"}"></i>`).join("")}</div><div class="read" onclick="article('${q(g.title)}')">Baca guide ▶</div></div></article>`}
function esportsCard(e){return `<article class="card esport"><div class="visual">${e.img?`<img class="pimg" src="${e.img}" alt="">`:spr("aegis",64)}</div><div class="body"><div class="tag">Arena · ${e.cat||"Esports"}</div><div class="title-c">${e.title}</div><div class="meta">${e.date||"Update pertandingan"}</div><div class="read" onclick="article('${q(e.title)}')">Lihat detail ▶</div></div></article>`}
const head=(h,p,btn)=>`<div class="section-head"><div><h2>${h}</h2><p>${p}</p></div>${btn||""}</div>`;

function home(){
A.innerHTML=`<section class="hero"><div class="hero-grid">
<div class="box title"><div class="kicker">★ POJOKDOTA · MEDIA + MARKETPLACE</div><h1>Tempat nongkrong<br>sebelum masuk arena.</h1><p>Baca update Dota 2, lihat guide, ikuti esports, atau belanja item dan top up.</p><div class="hero-actions"><button class="btn red" onclick="news()">▶ Baca Berita</button><button class="btn" onclick="shop('dota')">Lihat Item Dota 2</button></div><div class="trust">♥ Update rutin &nbsp; ♥ Pilihan jelas &nbsp; ♥ Bantuan siap</div></div>
<div class="box scene"><div class="stage"><div class="cloud rad-only"></div><div class="ember dire-only"></div><div class="sun"></div><div class="s-tree1 rad-only">${spr("tree",72)}</div><div class="s-tree2 rad-only">${spr("tree",96)}</div><div class="s-tree1 dire-only">${spr("dtree",80)}</div><div class="s-tree2 dire-only">${spr("dtree",96)}</div><div class="s-tower">${spr("tower",128)}</div><div class="s-aegis">${spr("aegis",88)}</div><div class="s-sword">${spr("rapier",72)}</div></div>
<div class="ground"><div class="dialog"><div class="kicker">FEATURED</div><h2>Meta baru, build baru, dan cerita baru dari medan pertempuran.</h2><p>Contoh artikel utama PojokDota. Nanti bagian ini bisa diisi berita pilihan dari admin.</p><span class="arrow">▼</span></div></div></div>
</div></section>
<section class="section">${head("Pilihan","Mau cari apa?")}
<div class="category-row">
<div class="card cat" onclick="news()"><div class="slot">${spr("scroll",36)}</div><b>Berita</b><small>Patch, update, komunitas</small></div>
<div class="card cat" onclick="guides()"><div class="slot">${spr("book",36)}</div><b>Guide</b><small>Build, tips, hero</small></div>
<div class="card cat" onclick="esports()"><div class="slot">${spr("aegis",36)}</div><b>Esports</b><small>Turnamen & hasil</small></div>
<div class="card cat" onclick="shop('dota')"><div class="slot">${spr("rapier",36)}</div><b>Item Dota 2</b><small>Arcana, Immortal, Cache</small></div>
<div class="card cat" onclick="shop('topup')"><div class="slot">${spr("coin",36)}</div><b>Top Up</b><small>ML, Roblox, Steam</small></div>
</div></section>
<section class="section">${head("Berita","Quest log: update terbaru.",`<button class="btn" onclick="news()">Semua Berita</button>`)}<div class="grid-3">${articles.slice(0,3).map(articleCard).join("")}</div></section>
<section class="section">${head("Guide pilihan","Tips yang mudah dipakai.",`<button class="btn" onclick="guides()">Lihat Guide</button>`)}<div class="grid-3">${guidesData.slice(0,3).map(guideCard).join("")}</div></section>
<section class="section">${head("Item Dota 2 pilihan","Koleksi favorit pemain.",`<button class="btn" onclick="shop('dota')">Ke toko</button>`)}<div class="grid-4">${products.filter(p=>p.cat==="dota").map(productCard).join("")}</div></section>
<section class="section">${head("Esports","Update dari arena.",`<button class="btn" onclick="esports()">Lihat Esports</button>`)}<div class="grid-3">${esportsData.slice(0,3).map(esportsCard).join("")}</div></section>`;
updateCart();scrollTo(0,0)}
const tabs=(l,f)=>`<div class="tabs">${l.map((t,i)=>`<button class="tab${i?"":" active"}" onclick="${f}(this,'${q(t)}')">${t}</button>`).join("")}</div>`;
const G=()=>document.getElementById("gl"),empty=m=>`<div class='empty'>${m}</div>`;
const allNews=()=>realNews?articles:articles.concat(articles),allGuides=()=>realGuides?guidesData:guidesData.concat(guidesData);
function setTab(b){b.parentNode.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active")}
function fNews(b,t){setTab(b);G().innerHTML=allNews().filter(a=>t==="Semua"||a.cat===t).map(articleCard).join("")||empty("Belum ada berita di kategori ini.")}
function fGuide(b,t){setTab(b);G().innerHTML=allGuides().filter(g=>t==="Semua"||g.role===t).map(guideCard).join("")||empty("Belum ada guide untuk role ini.")}
function fEsp(b,t){setTab(b);G().innerHTML=esportsData.filter(e=>t==="Semua"||e.cat===t).map(esportsCard).join("")||empty("Belum ada esports di kategori ini.")}
function fShop(b,t){setTab(b);G().innerHTML=products.filter(p=>p.cat==="dota"&&(t==="Semua"||RAR[p.sub][1]===t)).map(productCard).join("")||empty("Belum ada item di kategori ini.")}
function news(){A.innerHTML=`<section class="section">${head("Berita","Patch, update, esports, dan cerita gaming.")}${tabs(["Semua","Dota 2","Esports","Update","Gaming","Komunitas"],"fNews")}<div class="grid-3" id="gl">${allNews().map(articleCard).join("")||empty("Belum ada berita.")}</div></section>`;scrollTo(0,0)}
function guides(){A.innerHTML=`<section class="section">${head("Guide & Tutorial","Panduan ringan untuk pemain baru sampai kolektor.")}${tabs(["Semua","Carry","Mid","Offlane","Support","Item","New Player","Tips"],"fGuide")}<div class="grid-3" id="gl">${allGuides().map(guideCard).join("")||empty("Belum ada guide.")}</div></section>`;scrollTo(0,0)}
function esports(){A.innerHTML=`<section class="section">${head("Esports","Berita turnamen, hasil, jadwal, dan komunitas.")}${tabs(["Semua","Turnamen","Jadwal","Hasil","Tim dan Roster","Pemain","Komunitas"],"fEsp")}<div class="grid-3" id="gl">${esportsData.map(esportsCard).join("")||empty("Belum ada berita esports.")}</div></section>`;scrollTo(0,0)}
function shop(cat){const title=cat==="dota"?"Item Dota 2":cat==="wallet"?"Steam Wallet":cat==="topup"?"Top Up Game":"Item Game Lain";let list=products.filter(p=>p.cat===cat);if(!list.length)list=products;A.innerHTML=`<section class="section">${head(title,"Belanja kebutuhan gaming kamu.")}${cat==="dota"?tabs(["Semua","Collector's Cache","Bundle Set","Arcana","Immortal"],"fShop"):""}<div class="grid-4" id="gl">${list.map(productCard).join("")}</div></section>`;scrollTo(0,0)}
function article(title){const a=articles.find(x=>x.title===title)||esportsData.find(x=>x.title===title)||guidesData.find(x=>x.title===title);const body=a&&a.body&&a.body.trim()?a.body.split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join(""):`<p>Ini contoh halaman artikel. Admin dapat menambah judul, gambar, isi, dan produk terkait.</p><p>Dengan model portal + marketplace, pembaca dapat menemukan informasi terlebih dahulu lalu berpindah ke toko ketika membutuhkan item, top up, atau produk digital.</p>`;document.getElementById("modalContent").innerHTML=`<div class="tag">POJOKDOTA · ${a?esc(a.cat||a.role||"ARTIKEL"):"ARTIKEL"}</div><h2>${esc(title)}</h2><p class="meta">${a?esc(a.date||a.desc||""):"5 Oktober 2026"}</p><div class="visual" style="height:${a&&a.img?240:180}px;margin:18px 0;border:4px solid #f4f4f4">${a&&a.img?`<img class="pimg" src="${a.img}" alt="">`:spr("scroll",96)}</div>${body}`;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function addCart(name){const i=cart.find(x=>x.name===name);if(i)i.qty++;else cart.push({name,qty:1});updateCart();toast("+ "+name+" masuk tas")}
const WA="6282213190909",TG="pojokdota";
function order(items,ch){const price=x=>((products.find(p=>p.name===x.name)||{}).price||0)*x.qty;const tot=items.reduce((a,x)=>a+price(x),0);const msg=`Halo PojokDota, saya mau beli:\n${items.map(x=>`- ${x.name} x${x.qty} (${rp(price(x))})`).join("\n")}\nTotal: ${rp(tot)}\n\nMohon info cara pembayarannya. Terima kasih!`;const t=encodeURIComponent(msg);if(ch==="tg"){if(navigator.clipboard)navigator.clipboard.writeText(msg).then(()=>toast("Pesan disalin. Tempel di Telegram jika kolom chat kosong"),()=>{});window.open(`https://t.me/${TG}?text=${t}`,"_blank","noopener")}else window.open(`https://wa.me/${WA}?text=${t}`,"_blank","noopener")}
function buyNow(name,ch){order([{name,qty:1}],ch)}
function removeItem(i){cart.splice(i,1);updateCart();cartOpen()}
function checkoutWA(){if(cart.length)order(cart)}
function checkoutTG(){if(cart.length)order(cart,"tg")}
function cartOpen(){const tot=cart.reduce((a,x)=>a+x.qty*((products.find(p=>p.name===x.name)||{}).price||0),0);document.getElementById("modalContent").innerHTML=`<h2>Tas belanja</h2>${cart.length?cart.map((x,i)=>`<div style="padding:12px 0;border-bottom:2px dashed #566c86;display:flex;justify-content:space-between;align-items:center;gap:10px"><b>${x.name}</b><span style="display:flex;align-items:center;gap:12px;white-space:nowrap">x${x.qty}<button class="close" style="float:none;font-size:9px;padding:6px 8px" onclick="removeItem(${i})" aria-label="Hapus ${x.name} dari tas">Hapus</button></span></div>`).join("")+`<div style="margin-top:16px;display:flex;align-items:center;gap:8px;font:12px var(--px);color:#ffcd75">${spr("coin",18)}${rp(tot)}</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn red" onclick="checkoutWA()">Checkout via WhatsApp</button><button class="btn red" onclick="checkoutTG()">Checkout via Telegram</button></div>`:"<div class='empty'>Tas masih kosong. Ambil item dulu di toko.</div>"}`;document.getElementById("modal").classList.add("show")}
function doSearch(){const s=document.getElementById("search").value.trim().toLowerCase();if(!s)return home();const a=articles.filter(x=>(x.title+x.cat).toLowerCase().includes(s)),g=guidesData.filter(x=>(x.title+x.role+x.desc).toLowerCase().includes(s)),p=products.filter(x=>x.name.toLowerCase().includes(s));A.innerHTML=`<section class="section">${head("Hasil pencarian",`Menampilkan hasil untuk "<b>${s.replace(/</g,"&lt;")}</b>".`)}${a.length?`<h3>Berita</h3><div class="grid-3">${a.map(articleCard).join("")}</div>`:""}${g.length?`<h3 style="margin-top:25px">Guide</h3><div class="grid-3">${g.map(guideCard).join("")}</div>`:""}${p.length?`<h3 style="margin-top:25px">Produk</h3><div class="grid-4">${p.map(productCard).join("")}</div>`:""}${!a.length&&!g.length&&!p.length?`<div class="empty">Tidak ada hasil. Coba kata kunci lain.</div>`:""}</section>`}
function applyTheme(m){document.documentElement.classList.toggle("dark",m==="dark");localStorage.setItem("pjd_theme",m);document.getElementById("themeLabel").textContent=m==="dark"?"Dire":"Radiant"}
function toggleTheme(){applyTheme(document.documentElement.classList.contains("dark")?"light":"dark")}
(function(){document.getElementById("cartIcon").innerHTML=spr("chest",22);applyTheme(localStorage.getItem("pjd_theme")==="dark"?"dark":"light");fetch("data.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{if(d&&Array.isArray(d.products))products=d.products;if(d&&Array.isArray(d.articles)){articles=d.articles;realNews=true}if(d&&Array.isArray(d.guides)){guidesData=d.guides;realGuides=true}if(d&&Array.isArray(d.esports))esportsData=d.esports}).catch(()=>{}).then(home)})();
</script>
